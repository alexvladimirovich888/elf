<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALON TOY FACTORY</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', cursive, sans-serif;
      background: #ffffff;
      overflow: hidden;
      height: 100%;
      position: relative;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
    }

    * {
      box-sizing: border-box;
    }

    .container {
      height: 100vh;
      min-height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem;
      position: relative;
      z-index: 1;
      margin: 0 auto;
    }

    /* Snowflakes */
    .snowflake {
      position: absolute;
      top: -10px;
      color: #fff;
      font-size: 1.5rem;
      animation: fall linear infinite;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
      z-index: 0;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 1rem;
      width: 100%;
    }

    .main-title {
      font-size: 3.5rem;
      font-weight: bold;
      margin: 0;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.2);
      line-height: 1.2;
    }

    .subtitle {
      font-size: 1.3rem;
      margin: 0.5rem 0 0 0;
      font-style: italic;
    }

    /* Main Scene */
    .scene {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 1rem 0;
    }

    .factory-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Conveyor Belt */
    .conveyor {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 80px;
      background: #ffffff;
      border-radius: 10px;
      border: 3px solid #5a3a1a;
      overflow: hidden;
    }

    .conveyor-items {
      display: flex;
      gap: 100px;
      animation: conveyorMove 15s linear infinite;
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
    }

    @keyframes conveyorMove {
      from {
        transform: translateX(0) translateY(-50%);
      }
      to {
        transform: translateX(-50%) translateY(-50%);
      }
    }

    .conveyor-item {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
    }

    .conveyor-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Elves */
    .elf {
      position: absolute;
      width: 120px;
      height: 120px;
    }

    .elf img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .elf1 {
      left: 15%;
      top: 30%;
    }

    .elf2 {
      right: 15%;
      top: 30%;
    }

    .elf3 {
      left: 50%;
      top: 20%;
      transform: translateX(-50%);
    }

    /* Sign */
    .sign {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #ffffff;
      padding: 1.5rem 2rem;
      border-radius: 15px;
      border: 4px solid #c41e3a;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    .sign-text {
      font-size: 1.8rem;
      font-weight: bold;
      color: #c41e3a;
      text-align: center;
      margin: 0;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }

    /* Twinkling Lights */
    .lights {
      position: absolute;
      top: 10%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      padding: 0 2rem;
    }

    .light {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      animation: twinkle 1.5s ease-in-out infinite;
    }

    .light:nth-child(odd) {
      animation-delay: 0.75s;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.4;
        transform: scale(0.8);
      }
    }

    /* Bottom Section */
    .bottom-section {
      text-align: center;
      margin-top: 1rem;
      width: 100%;
    }

    .tagline {
      font-size: 1.2rem;
      margin: 0 0 1.5rem 0;
      font-style: italic;
    }

    .naughty-button {
      padding: 1rem 2.5rem;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
      font-family: inherit;
    }

    .naughty-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .naughty-button:active {
      transform: translateY(-1px);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      padding: 2.5rem;
      border-radius: 20px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .modal-title {
      font-size: 2rem;
      font-weight: bold;
      margin: 0 0 1rem 0;
    }

    .modal-text {
      font-size: 1.3rem;
      margin: 0 0 2rem 0;
    }

    .modal-button {
      padding: 0.8rem 2rem;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    .modal-button:hover {
      transform: scale(1.05);
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 0.95rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 2px solid rgba(0, 0, 0, 0.1);
      width: 100%;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main-title {
        font-size: 2.5rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      .sign-text {
        font-size: 1.3rem;
      }

      .tagline {
        font-size: 1rem;
      }

      .naughty-button {
        font-size: 1.1rem;
        padding: 0.8rem 2rem;
      }

      .elf {
        width: 80px;
        height: 80px;
      }

      .conveyor {
        height: 60px;
      }

      .conveyor-item {
        width: 40px;
        height: 40px;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body><!-- Snowflakes -->
  <div id="snowflakes"></div><!-- Twinkling Lights -->
  <div class="lights">
   <div class="light"></div>
   <div class="light"></div>
   <div class="light"></div>
   <div class="light"></div>
   <div class="light"></div>
   <div class="light"></div>
   <div class="light"></div>
   <div class="light"></div>
  </div>
  <div class="container"><!-- Header -->
   <div class="header">
    <h1 class="main-title" id="mainTitle">ALON TOY FACTORY</h1>
    <p class="subtitle" id="subtitle">Where good traders get gifts… and toxic meme lords get nothing!</p>
   </div><!-- Main Scene -->
   <div class="scene">
    <div class="factory-container"><!-- Elves -->
     <div class="elf elf1"><img src="https://i.postimg.cc/ZKpX5sNZ/ADS-23.png" alt="Elf crafting" onerror="this.src=''; this.alt='Elf image failed to load'; this.style.display='none';">
     </div>
     <div class="elf elf2"><img src="https://i.postimg.cc/ZKpX5sNZ/ADS-23.png" alt="Elf working" onerror="this.src=''; this.alt='Elf image failed to load'; this.style.display='none';">
     </div>
     <div class="elf elf3"><img src="https://i.postimg.cc/ZKpX5sNZ/ADS-23.png" alt="Mischievous elf" onerror="this.src=''; this.alt='Elf image failed to load'; this.style.display='none';">
     </div><!-- Sign -->
     <div class="sign">
      <p class="sign-text">NO TOYS FOR<br>
       TOXIC TRADERS!</p>
     </div><!-- Conveyor Belt -->
     <div class="conveyor">
      <div class="conveyor-items" id="conveyorItems"></div>
     </div>
    </div>
   </div><!-- Bottom Section -->
   <div class="bottom-section">
    <p class="tagline" id="tagline">Be kind, stay merry, and maybe Santa will airdrop you something nice.</p><button class="naughty-button" id="naughtyButton">Check Your Naughty Score</button>
   </div><!-- Footer -->
   <div class="footer">
    <p id="footerText">Made by the Elf DAO | No refunds. Only coal.</p>
   </div>
  </div><!-- Modal -->
  <div class="modal" id="modal">
   <div class="modal-content">
    <h2 class="modal-title">🎅 ACCESS DENIED 🎅</h2>
    <p class="modal-text">Too many rugs this year.<br>
     Santa's watching! 👀</p><button class="modal-button" id="closeModal">Try Being Nice</button>
   </div>
  </div>
  <script>
    const defaultConfig = {
      main_title: "ALON TOY FACTORY",
      subtitle: "Where good traders get gifts… and toxic meme lords get nothing!",
      tagline: "Be kind, stay merry, and maybe Santa will airdrop you something nice.",
      button_text: "Check Your Naughty Score",
      footer_text: "Made by the Elf DAO | No refunds. Only coal.",
      background_color: "#ffffff",
      title_color: "#c41e3a",
      subtitle_color: "#165b33",
      button_color: "#ffd700",
      button_text_color: "#c41e3a",
      modal_bg_color: "#ffffff",
      modal_text_color: "#c41e3a",
      modal_button_color: "#165b33",
      modal_button_text_color: "#ffffff",
      light_color_1: "#ff0000",
      light_color_2: "#00ff00",
      light_color_3: "#ffd700"
    };

    async function onConfigChange(config) {
      document.getElementById('mainTitle').textContent = config.main_title || defaultConfig.main_title;
      document.getElementById('subtitle').textContent = config.subtitle || defaultConfig.subtitle;
      document.getElementById('tagline').textContent = config.tagline || defaultConfig.tagline;
      document.getElementById('naughtyButton').textContent = config.button_text || defaultConfig.button_text;
      document.getElementById('footerText').textContent = config.footer_text || defaultConfig.footer_text;

      document.body.style.background = config.background_color || defaultConfig.background_color;
      document.getElementById('mainTitle').style.color = config.title_color || defaultConfig.title_color;
      document.getElementById('subtitle').style.color = config.subtitle_color || defaultConfig.subtitle_color;
      
      const button = document.getElementById('naughtyButton');
      button.style.background = config.button_color || defaultConfig.button_color;
      button.style.color = config.button_text_color || defaultConfig.button_text_color;

      const modalContent = document.querySelector('.modal-content');
      modalContent.style.background = config.modal_bg_color || defaultConfig.modal_bg_color;
      document.querySelector('.modal-title').style.color = config.modal_text_color || defaultConfig.modal_text_color;
      document.querySelector('.modal-text').style.color = config.modal_text_color || defaultConfig.modal_text_color;

      const modalButton = document.getElementById('closeModal');
      modalButton.style.background = config.modal_button_color || defaultConfig.modal_button_color;
      modalButton.style.color = config.modal_button_text_color || defaultConfig.modal_button_text_color;

      const lights = document.querySelectorAll('.light');
      const lightColors = [
        config.light_color_1 || defaultConfig.light_color_1,
        config.light_color_2 || defaultConfig.light_color_2,
        config.light_color_3 || defaultConfig.light_color_3
      ];
      lights.forEach((light, index) => {
        light.style.background = lightColors[index % lightColors.length];
      });
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => {
                config.background_color = value;
                window.elementSdk.setConfig({ background_color: value });
              }
            },
            {
              get: () => config.title_color || defaultConfig.title_color,
              set: (value) => {
                config.title_color = value;
                window.elementSdk.setConfig({ title_color: value });
              }
            },
            {
              get: () => config.button_color || defaultConfig.button_color,
              set: (value) => {
                config.button_color = value;
                window.elementSdk.setConfig({ button_color: value });
              }
            },
            {
              get: () => config.modal_button_color || defaultConfig.modal_button_color,
              set: (value) => {
                config.modal_button_color = value;
                window.elementSdk.setConfig({ modal_button_color: value });
              }
            },
            {
              get: () => config.light_color_1 || defaultConfig.light_color_1,
              set: (value) => {
                config.light_color_1 = value;
                window.elementSdk.setConfig({ light_color_1: value });
              }
            }
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ["main_title", config.main_title || defaultConfig.main_title],
          ["subtitle", config.subtitle || defaultConfig.subtitle],
          ["tagline", config.tagline || defaultConfig.tagline],
          ["button_text", config.button_text || defaultConfig.button_text],
          ["footer_text", config.footer_text || defaultConfig.footer_text]
        ])
      });
    }

    // Create snowflakes
    const snowflakesContainer = document.getElementById('snowflakes');
    for (let i = 0; i < 30; i++) {
      const snowflake = document.createElement('div');
      snowflake.className = 'snowflake';
      snowflake.textContent = '❄';
      snowflake.style.left = Math.random() * 100 + '%';
      snowflake.style.animationDuration = (Math.random() * 3 + 5) + 's';
      snowflake.style.animationDelay = Math.random() * 5 + 's';
      snowflake.style.fontSize = (Math.random() * 1 + 1) + 'rem';
      snowflakesContainer.appendChild(snowflake);
    }

    // Create conveyor items
    const conveyorItems = document.getElementById('conveyorItems');
    const giftImages = [
      'https://i.postimg.cc/FHstCgYp/ADS-26.png',
      'https://i.postimg.cc/rpKBMVC5/ADS-25.png',
      'https://i.postimg.cc/5tTZthst/ADS-24.png'
    ];

    for (let i = 0; i < 20; i++) {
      const item = document.createElement('div');
      item.className = 'conveyor-item';
      const img = document.createElement('img');
      img.src = giftImages[i % giftImages.length];
      img.alt = 'Gift';
      img.onerror = function() {
        this.src = '';
        this.alt = 'Gift image failed to load';
        this.style.display = 'none';
      };
      item.appendChild(img);
      conveyorItems.appendChild(item);
    }

    // Modal functionality
    const modal = document.getElementById('modal');
    const naughtyButton = document.getElementById('naughtyButton');
    const closeModalButton = document.getElementById('closeModal');

    naughtyButton.addEventListener('click', () => {
      modal.classList.add('active');
    });

    closeModalButton.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('active');
      }
    });

    onConfigChange(defaultConfig);
  </script>
